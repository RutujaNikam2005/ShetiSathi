<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>जमा रक्कम इतिहास - शेतीसाथी</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f7f3;
        }

        .header {
            background: #198754;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .customer {
            font-size: 20px;
            font-weight: bold;
            color: #198754;
        }

        .amount {
            font-size: 18px;
            font-weight: bold;
            color: #0d6efd;
        }

        .date {
            color: #666;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #6c757d;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>💰 जमा रक्कम इतिहास</h1>
</div>

<div class="container">

    {% if payments %}

        {% for payment in payments %}

        <div class="card">

            <div class="customer">
                👤 {{ payment[0] }}
            </div>

            <p>📱 मोबाईल: {{ payment[1] }}</p>

            <p>🚜 सेवा: {{ payment[2] }}</p>

            <p class="amount">
                💰 जमा रक्कम: ₹{{ payment[3] }}
            </p>

            <p>
                ⏳ बाकी रक्कम: ₹{{ payment[4] }}
            </p>

            <p class="date">
                📅 {{ payment[5] }}
            </p>

        </div>

        {% endfor %}

    {% else %}

        <div class="card">
            <h3>❌ जमा रक्कम इतिहास सापडला नाही.</h3>
        </div>

    {% endif %}

    <button onclick="window.location.href='/'">
        ← मुख्य पृष्ठावर जा
    </button>

</div>

</body>
</html>
