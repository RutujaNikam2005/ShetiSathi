<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>दर व्यवस्थापन - शेतीसाथी</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f7f3;
        }

        .header {
            background: #198754;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #198754;
            color: white;
            font-size: 16px;
        }

        .back {
            background: #6c757d;
        }

        .rate {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>⚙️ दर व्यवस्थापन</h1>
</div>

<div class="container">

    {% for rate in rates %}

    <div class="card">

        <div class="rate">
            🚜 {{ rate[1] }}
        </div>

        <p>
            📏 हिशोबाचा प्रकार:
            
            {% if rate[2] == "acre" %}
                एकर
            {% elif rate[2] == "hour" %}
                तास
            {% elif rate[2] == "trip" %}
                फेरी
            {% elif rate[2] == "sack" %}
                गोणी
            {% else %}
                {{ rate[2] }}
            {% endif %}
        </p>

        <form method="POST">

            <input
                type="hidden"
                name="rate_id"
                value="{{ rate[0] }}"
            >

            <label>दर (₹)</label>

            <input
                type="number"
                step="0.01"
                name="rate"
                value="{{ rate[3] }}"
                required
            >

            <button type="submit">
                💾 दर अद्ययावत करा
            </button>

        </form>

    </div>

    {% endfor %}

    <button class="back" onclick="window.location.href='/'">
        ← मुख्य पृष्ठावर जा
    </button>

</div>

</body>
</html>
